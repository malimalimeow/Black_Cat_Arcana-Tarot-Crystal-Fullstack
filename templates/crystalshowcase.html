{% extends "layout.html" %}

{% block title %}
    crystals
{% endblock %}

{% block main %}
    {% for crystal in crystals%}
<a href="{{url_for('crystal',crystal_name=crystal.name)}}">
    <div class="imagebg">
    <img src="https://heidy-firs-app-2026-blackcat.s3.us-east-1.amazonaws.com/static/crystal_image/{{crystal.image}}" alt="{{crystal.name}}">
    <p class="caption">{{crystal.name}}</p>
    </div>
</a>
    {%endfor%}

{% endblock %}
