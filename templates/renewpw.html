{% extends "layout.html" %}

{% block title %}
    renew password
{% endblock %}

{% block main %}
    <form action="/renewpw" method="post">
        <div class="mb-3">
        <input class="form-control mx-auto w-auto" autofocus autocomplete="off" name="username" placeholder="Username" type="text">
        </div>
        <div class="mb-3">
        <input class="form-control mx-auto w-auto" autocomplete="off" name="old_password" placeholder="Old password" type="password">
        </div>
        <div class="mb-3">
        <input class="form-control mx-auto w-auto" autocomplete="off" name="new_password" placeholder="New password" type="password">
        </div>
        <div class="mb-3">
        <input class="form-control mx-auto w-auto" autocomplete="off" name="confirmation" placeholder="Confirm Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">renew password</button>
    </form>
{% endblock %}
